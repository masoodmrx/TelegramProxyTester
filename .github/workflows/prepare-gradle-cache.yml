name: Prepare Gradle Offline Cache

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      # This generates .flutter-plugins-dependencies so Gradle discovers
      # every Android plugin used by the application.
      - name: Download Flutter packages
        run: flutter pub get

      - name: Download Gradle dependencies
        shell: powershell
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          Set-Location android
          .\gradlew.bat assembleDebug --refresh-dependencies

      - name: Stop Gradle daemons
        shell: powershell
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          Set-Location android
          .\gradlew.bat --stop

      - name: Package Gradle cache
        shell: powershell
        run: |
          $bundle = "$env:RUNNER_TEMP\gradle-offline"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          robocopy "$env:USERPROFILE\.gradle\caches" "$bundle\caches" `
            /E /XF *.lock *.lck
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

          robocopy "$env:USERPROFILE\.gradle\wrapper" "$bundle\wrapper" `
            /E /XF *.lock *.lck
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

          # PowerShell Compress-Archive is too slow for the large Gradle
          # distribution and may be terminated before the artifact is made.
          # Use an absolute output path so tar does not create the archive
          # inside $bundle and include the archive in itself.
          $archive = Join-Path (Get-Location) "gradle-offline-cache.zip"
          tar.exe -a -c -f "$archive" -C "$bundle" .

          if (-not (Test-Path $archive)) {
            throw "Gradle cache archive was not created."
          }

      - name: Upload Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-offline-cache
          path: gradle-offline-cache.zip
          retention-days: 7
